[build-system]
requires = [ "setuptools>=42", "wheel", "ninja; sys_platform == 'windows'", "numpy" ]

build-backend = "setuptools.build_meta"

[tool.cibuildwheel.macos]
archs                = [ "native" ]
before-all           = [ "pushd pymnn/pip_package", "python3 build_deps.py llm", "popd" ]
build                = "cp*-macosx_*"
repair-wheel-command = ""

[tool.cibuildwheel.linux]
archs = [ "native" ]
before-all = [ "pushd pymnn/pip_package", "python3 build_deps.py llm", "popd" ]
build = "cp*-manylinux*"
repair-wheel-command = [
    "export LD_LIBRARY_PATH=$(pwd)/pymnn_build/tools/converter/libtorch/lib:$LD_LIBRARY_PATH",
    "echo $LD_LIBRARY_PATH",
    "auditwheel repair -w {dest_dir} {wheel}",
]
skip = "pp*"

[tool.cibuildwheel.windows]
before-all = [ "cd pymnn/pip_package", "python3 build_deps.py llm", "cd ../.." ]
