name: android
on:
  push:
    branches:
     - master
     - 'feature/**'
    paths:
      - 'source/**'
      - 'express/**'
      - 'test/**'
      - 'project/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [master]
    paths:
      - 'source/**'
      - 'express/**'
      - 'test/**'
      - 'project/android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  android_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build_android_64
        run: |
            cmake -S . -B build_64 \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_STL=c++_static \
              -DANDROID_NATIVE_API_LEVEL=android-21 \
              -DMNN_USE_LOGCAT=OFF \
              -DMNN_USE_SSE=OFF \
              -DMNN_BUILD_BENCHMARK=ON \
              -DMNN_BUILD_TEST=ON \
              -DMNN_BUILD_FOR_ANDROID_COMMAND=ON \
              -DMNN_LOW_MEMORY=ON \
              -DMNN_CPU_WEIGHT_DEQUANT_GEMM=ON \
              -DMNN_BUILD_LLM=ON \
              -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
              -DLLM_SUPPORT_VISION=ON \
              -DMNN_BUILD_OPENCV=ON \
              -DMNN_IMGCODECS=ON \
              -DLLM_SUPPORT_AUDIO=ON \
              -DMNN_BUILD_AUDIO=ON \
              -DMNN_SUPPORT_BF16=ON
            cmake --build build_64 --parallel 4
      - name: build_android_32
        run: |
            cmake -S . -B build_32 \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DANDROID_ABI=armeabi-v7a \
              -DANDROID_STL=c++_static \
              -DANDROID_NATIVE_API_LEVEL=android-14 \
              -DANDROID_TOOLCHAIN=clang \
              -DMNN_USE_LOGCAT=OFF \
              -DMNN_USE_SSE=OFF \
              -DMNN_BUILD_TEST=ON \
              -DMNN_ARM82=OFF \
              -DMNN_BUILD_FOR_ANDROID_COMMAND=ON \
              -DMNN_LOW_MEMORY=ON \
              -DMNN_CPU_WEIGHT_DEQUANT_GEMM=ON \
              -DMNN_BUILD_LLM=ON \
              -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
              -DLLM_SUPPORT_AUDIO=ON \
              -DMNN_BUILD_AUDIO=ON \
              -DLLM_SUPPORT_VISION=ON \
              -DMNN_BUILD_OPENCV=ON \
              -DMNN_IMGCODECS=ON
            cmake --build build_32 --parallel 4
